<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf9">
  <title>Quedamos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23ecfdf5'/><rect x='6' y='6' width='9' height='9' rx='2.5' fill='%23a7f3d0'/><rect x='17' y='6' width='9' height='9' rx='2.5' fill='%2310b981'/><rect x='6' y='17' width='9' height='9' rx='2.5' fill='%23047857'/><rect x='17' y='17' width='9' height='9' rx='2.5' fill='%2334d399'/></svg>">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-dvh font-sans">
  <header class="sticky top-0 z-30 border-b border-stone-200/70 bg-stone-50/80 backdrop-blur-lg">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-3 px-4 sm:px-6">
      <a href="#/" class="flex items-center gap-2.5 rounded-xl text-xl font-bold tracking-tight text-stone-900">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="brand-name">Quedamos</span>
      </a>
      <!-- language switch, filled in by app.js -->
      <div id="lang-switch" role="group" class="ml-auto flex gap-0.5 rounded-full bg-stone-200/70 p-1"></div>
      <a href="https://github.com/duke8585/quedamos" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"
        class="grid size-9 place-items-center rounded-full text-stone-500 transition hover:bg-stone-200/70 hover:text-stone-900">
        <svg viewBox="0 0 16 16" class="size-5" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <div id="update-banner" hidden class="sticky top-16 z-20 bg-stone-900 text-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-2.5 sm:px-6">
      <span id="update-text" class="font-medium">A new version of this page is available.</span>
      <button type="button" id="update-reload" onclick="location.reload()" class="btn btn-sm text-stone-900">Reload</button>
    </div>
  </div>

  <main id="app" class="mx-auto max-w-6xl px-4 pt-6 pb-32 sm:px-6"></main>

  <div id="toast" hidden role="status" aria-live="polite"
    class="toast-in fixed bottom-6 left-1/2 z-40 flex max-w-[calc(100%-2rem)] -translate-x-1/2 items-center gap-4 rounded-full bg-stone-900 px-5 py-3 text-white shadow-2xl"></div>

  <dialog id="modal" class="m-auto w-[min(26rem,calc(100%-2rem))] rounded-3xl p-0 shadow-2xl backdrop:bg-stone-900/50 backdrop:backdrop-blur-sm">
    <form method="dialog" class="flex flex-col gap-4 p-6">
      <div>
        <h3 id="modal-title" class="text-xl font-bold"></h3>
        <p id="modal-text" class="mt-1 text-stone-600"></p>
      </div>
      <!-- event id as "username", so password managers keep one password per event, not one per site -->
      <input id="modal-user" type="text" autocomplete="username" hidden tabindex="-1">
      <input id="modal-input" type="password" autocomplete="current-password" class="input">
      <p id="modal-error" hidden class="font-semibold text-rose-700"></p>
      <div class="flex justify-end gap-3">
        <button type="button" id="modal-cancel" class="btn">Cancel</button>
        <button value="ok" id="modal-ok" class="btn btn-primary">OK</button>
      </div>
    </form>
  </dialog>

  <script src="/i18n.js"></script>
  <script src="/calendar.js"></script>
  <script src="/app.js"></script>
</body>
</html>
